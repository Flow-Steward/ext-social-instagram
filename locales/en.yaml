ext.display_name: "Instagram"
ext.description: "Connect an Instagram professional account to Flow Steward for image publishing and comment management through the Instagram API with Instagram Login. Publish a photo with a caption and optional alternative text, or publish an image carousel. Read account posts, retrieve comments and replies, and send a reply to a comment on your own media.\n\nUse these actions to share prepared images for a blog article, announce a product update, or collect audience questions for a review workflow. The New Instagram comment trigger starts a workflow for a new root comment from another person. Follow-up steps can classify the question, prepare a response, or request human approval before replying.\n\nPublishing accepts publicly accessible HTTPS JPEG images, captions up to 2,200 characters and image carousels of 2 to 20 items. It returns publication status and available media identifiers and permalinks. Dedicated status and recovery actions let a workflow inspect or resume a known publishing container without creating the content again.\n\nConfigure a separate project connection for each professional account, using an Instagram Login access token with the required permissions. Signed comment delivery additionally needs a Meta app secret and public HTTPS webhook setup. Advertising, Reels, Stories, video, direct messages, image resizing and text generation are outside this extension; prepare media and copy in earlier workflow steps."
