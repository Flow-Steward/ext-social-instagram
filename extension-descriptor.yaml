schema_version: "extension_descriptor_v1"
lifecycle:
  data_schema_version: 1
  data_migrations: []
extension_id: "flowsteward.instagram"
release_version: "0.1.1"
extension_type: "service_extension"
identity:
  display_name: "Instagram"
  description: "Publish Instagram photos and image carousels, reply to comments, and start workflows when new comments arrive."
  tags:
    - "instagram"
    - "images"
    - "comments"
vendor:
  vendor_name: "Flow Steward"
  support_url: "https://github.com/Flow-Steward/ext-social-instagram/issues"
listing:
  visibility: "public_reference"
  category: "marketing"
distribution:
  channel: "private_byo"
  execution_modes:
    - "local"
  allows_self_hosted: true
  requires_connected_control_plane: false
  import_sources:
    - "file"
runtime:
  contract_version: "extension_host_v2"
  compatibility:
    platform_min: "1.9.0"
  extension_contract_v2:
    connection_types: "contracts/connection_types.yaml"
    operation_manifest: "contracts/operation_manifest.yaml"
    step_ui_manifest: "contracts/step_ui_manifest.yaml"
provenance:
  origin: "imported"
  notes: "Independent SDK-only extension. YAML declarations are canonical."
commerce:
  billing_mode: "free"
