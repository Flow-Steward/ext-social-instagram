type: "object"
additionalProperties: false
required:
  - "access_token"
  - "app_secret"
properties:
  access_token:
    type: "string"
    minLength: 1
    maxLength: 4096
    title: "Instagram Login user access token"
  app_secret:
    type: "string"
    minLength: 1
    maxLength: 4096
    title: "Meta app secret"
