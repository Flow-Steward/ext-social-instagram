queries:
  -
    query_id: "provider_health"
    title: "Instagram account selection"
    description: "Explain where to select an account; this ungated overview does not inspect saved credentials."
    required_scopes:
      - "extension:invoke"
    handler:
      mode: "extension"
    result_fields:
      - "result.status"
      - "result.configured"
      - "result.webhook_configured"
      - "result.missing_fields"
    error_codes:
      - "invalid_payload"
  -
    query_id: "connection_health"
    title: "Selected Instagram account readiness"
    description: "Read the selected account's redacted publishing and webhook readiness without provider traffic."
    connection:
      connection_type_ids:
        - "instagram_account"
    required_scopes:
      - "extension:invoke"
    handler:
      mode: "extension"
    result_fields:
      - "result.checks"
      - "result.status"
      - "result.configured"
      - "result.webhook_configured"
      - "result.missing_fields"
    error_codes:
      - "not_configured"
      - "invalid_payload"
      - "authentication_failed"
      - "permission_denied"
      - "foreign_object"
      - "not_found"
      - "rate_limited"
      - "provider_unavailable"
      - "timeout"
      - "response_too_large"
      - "ambiguous_external_effect"
      - "internal_error"
