      - "authentication_failed"
      - "permission_denied"
      - "foreign_object"
      - "not_found"
      - "rate_limited"
      - "provider_unavailable"
      - "timeout"
      - "response_too_large"
      - "ambiguous_external_effect"
      - "internal_error"
  -
    action_id: "list_posts"
