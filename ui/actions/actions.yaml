actions:
  -
    action_id: "publish_image"
    workflow_visible: true
    title: "Publish an Instagram photo"
    description: "Publish a public HTTPS JPEG with a caption and optional alternative text to the selected professional account. Caption limit: 2,200 characters; return status and available media ID and permalink."
    required_scopes:
      - "extension:invoke"
    handler:
      mode: "extension"
    mutates_platform: false
    parameters:
      -
        name: "image_url"
        type: "string"
        required: true
      -
        name: "caption"
        type: "string"
        required: true
        maxLength: 2200
      -
        name: "alt_text"
        type: "string"
        required: false
        maxLength: 1000
    result_fields:
      - "result.container_id"
      - "result.status"
      - "result.media_id"
      - "result.permalink"
    error_codes:
      - "not_configured"
      - "invalid_payload"
      - "authentication_failed"
      - "permission_denied"
      - "foreign_object"
      - "not_found"
      - "rate_limited"
      - "provider_unavailable"
      - "timeout"
      - "response_too_large"
      - "ambiguous_external_effect"
      - "internal_error"
  -
    action_id: "publish_carousel"
    workflow_visible: true
    title: "Publish an Instagram image carousel"
    description: "Publish 2 to 20 public HTTPS JPEG images as one carousel with a caption of up to 2,200 characters; return status and available media ID and permalink. A failed image prevents an incomplete album from being published."
    required_scopes:
      - "extension:invoke"
    handler:
      mode: "extension"
    mutates_platform: false
    parameters:
      -
        name: "image_urls"
        type: "array"
        required: true
        minItems: 2
        maxItems: 20
        items:
          type: "string"
      -
        name: "caption"
        type: "string"
        required: true
        maxLength: 2200
    result_fields:
      - "result.container_id"
      - "result.child_container_ids"
      - "result.status"
      - "result.media_id"
      - "result.permalink"
    error_codes:
      - "not_configured"
      - "invalid_payload"
      - "authentication_failed"
      - "permission_denied"
      - "foreign_object"
      - "not_found"
      - "rate_limited"
      - "provider_unavailable"
      - "timeout"
      - "response_too_large"
      - "ambiguous_external_effect"
      - "internal_error"
  -
    action_id: "get_publish_status"
    workflow_visible: true
    title: "Check Instagram publication status"
    description: "Read the status of a known publishing container for this connection. This read-only action does not create or publish content."
    required_scopes:
      - "extension:invoke"
    handler:
      mode: "extension"
    mutates_platform: false
    parameters:
      -
        name: "container_id"
        type: "string"
        required: true
    result_fields:
      - "result.container_id"
      - "result.status"
      - "result.status_code"
    error_codes:
      - "not_configured"
      - "invalid_payload"
      - "authentication_failed"
      - "permission_denied"
      - "foreign_object"
      - "not_found"
      - "rate_limited"
      - "provider_unavailable"
      - "timeout"
      - "response_too_large"
      - "ambiguous_external_effect"
      - "internal_error"
  -
    action_id: "publish_container"
    workflow_visible: true
    title: "Resume an Instagram publication"
    description: "Check a container already recorded for this connection and publish it only when ready. Reuse the existing container instead of creating the content again; do not blindly retry an unknown publication outcome."
    required_scopes:
      - "extension:invoke"
    handler:
      mode: "extension"
    mutates_platform: false
    parameters:
      -
        name: "container_id"
        type: "string"
        required: true
    result_fields:
      - "result.container_id"
      - "result.status"
      - "result.media_id"
      - "result.permalink"
    error_codes:
      - "not_configured"
      - "invalid_payload"
      - "authentication_failed"
      - "permission_denied"
      - "foreign_object"
      - "not_found"
      - "rate_limited"
      - "provider_unavailable"
      - "timeout"
      - "response_too_large"
      - "ambiguous_external_effect"
      - "internal_error"
  -
    action_id: "list_posts"
    workflow_visible: true
    title: "List Instagram account posts"
    description: "Read one page of media from the selected professional account; return items and a cursor for the next page."
    required_scopes:
      - "extension:invoke"
    handler:
      mode: "extension"
    mutates_platform: false
    parameters:
      -
        name: "limit"
        type: "integer"
        required: false
      -
        name: "cursor"
        type: "string"
        required: false
    result_fields:
      - "result.items"
      - "result.next_cursor"
    error_codes:
      - "not_configured"
      - "invalid_payload"
      - "authentication_failed"
      - "permission_denied"
      - "foreign_object"
      - "not_found"
      - "rate_limited"
      - "provider_unavailable"
      - "timeout"
      - "response_too_large"
      - "ambiguous_external_effect"
      - "internal_error"
  -
    action_id: "get_post"
    workflow_visible: true
    title: "Get an Instagram post"
    description: "Read a media item by ID after verifying it belongs to the selected professional account."
    required_scopes:
      - "extension:invoke"
    handler:
      mode: "extension"
    mutates_platform: false
    parameters:
      -
        name: "media_id"
        type: "string"
        required: true
    result_fields:
      - "result.post"
    error_codes:
      - "not_configured"
      - "invalid_payload"
      - "authentication_failed"
      - "permission_denied"
      - "foreign_object"
      - "not_found"
      - "rate_limited"
      - "provider_unavailable"
      - "timeout"
      - "response_too_large"
      - "ambiguous_external_effect"
      - "internal_error"
  -
    action_id: "list_comments"
    workflow_visible: true
    title: "List comments on an Instagram post"
    description: "Read one page of comments on media owned by the selected account; return comments and the next-page cursor."
    required_scopes:
      - "extension:invoke"
    handler:
      mode: "extension"
    mutates_platform: false
    parameters:
      -
        name: "media_id"
        type: "string"
        required: true
      -
        name: "limit"
        type: "integer"
        required: false
      -
        name: "cursor"
        type: "string"
        required: false
    result_fields:
      - "result.items"
      - "result.next_cursor"
    error_codes:
      - "not_configured"
      - "invalid_payload"
      - "authentication_failed"
      - "permission_denied"
      - "foreign_object"
      - "not_found"
      - "rate_limited"
      - "provider_unavailable"
      - "timeout"
      - "response_too_large"
      - "ambiguous_external_effect"
      - "internal_error"
  -
    action_id: "list_replies"
    workflow_visible: true
    title: "List replies to an Instagram comment"
    description: "Read one page of replies after checking that the comment belongs to media owned by the selected account."
    required_scopes:
      - "extension:invoke"
    handler:
      mode: "extension"
    mutates_platform: false
    parameters:
      -
        name: "comment_id"
        type: "string"
        required: true
      -
        name: "limit"
        type: "integer"
        required: false
      -
        name: "cursor"
        type: "string"
        required: false
    result_fields:
      - "result.items"
      - "result.next_cursor"
    error_codes:
      - "not_configured"
      - "invalid_payload"
      - "authentication_failed"
      - "permission_denied"
      - "foreign_object"
      - "not_found"
      - "rate_limited"
      - "provider_unavailable"
      - "timeout"
      - "response_too_large"
      - "ambiguous_external_effect"
      - "internal_error"
  -
    action_id: "reply_to_comment"
    workflow_visible: true
    title: "Reply to an Instagram comment"
    description: "Send a text reply to a comment on media owned by the selected professional account; return the reply ID."
    required_scopes:
      - "extension:invoke"
    handler:
      mode: "extension"
    mutates_platform: false
    parameters:
      -
        name: "comment_id"
        type: "string"
        required: true
      -
        name: "text"
        type: "string"
        required: true
    result_fields:
      - "result.comment_id"
    error_codes:
      - "not_configured"
      - "invalid_payload"
      - "authentication_failed"
      - "permission_denied"
      - "foreign_object"
      - "not_found"
      - "rate_limited"
      - "provider_unavailable"
      - "timeout"
      - "response_too_large"
      - "ambiguous_external_effect"
      - "internal_error"
  -
    action_id: "verify_connection"
    workflow_visible: false
    title: "Verify the Instagram account connection"
    description: "Read the configured professional account identity and check its ID without publishing content."
    required_scopes:
      - "extension:invoke"
    handler:
      mode: "extension"
    mutates_platform: false
    parameters: []
    result_fields:
      - "result.verified"
      - "result.ig_user_id"
    error_codes:
      - "not_configured"
      - "invalid_payload"
      - "authentication_failed"
      - "permission_denied"
      - "foreign_object"
      - "not_found"
      - "rate_limited"
      - "provider_unavailable"
      - "timeout"
      - "response_too_large"
      - "ambiguous_external_effect"
      - "internal_error"
  -
    action_id: "ingress_event"
    workflow_visible: false
    title: "Receive new Instagram comments"
    description: "Convert authenticated Instagram comment callbacks into new-comment workflow events for the configured accounts."
    required_scopes:
      - "extension:invoke"
    handler:
      mode: "extension"
    mutates_platform: false
    parameters: []
    result_fields:
      - "result.ingress_type"
    error_codes:
      - "not_configured"
      - "invalid_payload"
      - "authentication_failed"
      - "permission_denied"
      - "foreign_object"
      - "not_found"
      - "rate_limited"
      - "provider_unavailable"
      - "timeout"
      - "response_too_large"
      - "ambiguous_external_effect"
      - "internal_error"
