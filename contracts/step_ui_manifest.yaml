forms:
  -
    operation_id: "publish_image"
    title: "Publish Instagram image"
    fields:
      -
        name: "image_url"
        label: "Image url"
        widget_type: "text"
        required: true
      -
        name: "caption"
        label: "Caption"
        widget_type: "textarea"
        required: true
      -
        name: "alt_text"
        label: "Alt text"
        widget_type: "text"
        required: false
  -
    operation_id: "publish_carousel"
    title: "Publish Instagram image carousel"
    fields:
      -
        name: "image_urls"
        label: "Image urls"
        widget_type: "json"
        required: true
      -
        name: "caption"
        label: "Caption"
        widget_type: "textarea"
        required: true
  -
    operation_id: "get_publish_status"
    title: "Read Instagram publish status"
    fields:
      -
        name: "container_id"
        label: "Container id"
        widget_type: "text"
        required: true
  -
    operation_id: "publish_container"
    title: "Publish an existing Instagram container"
    fields:
      -
        name: "container_id"
        label: "Container id"
        widget_type: "text"
        required: true
  -
    operation_id: "list_posts"
    title: "List Instagram posts"
    fields:
      -
        name: "limit"
        label: "Limit"
        widget_type: "number"
        required: false
      -
        name: "cursor"
        label: "Cursor"
        widget_type: "text"
        required: false
  -
    operation_id: "get_post"
    title: "Get Instagram post"
    fields:
      -
        name: "media_id"
        label: "Media id"
        widget_type: "text"
        required: true
  -
    operation_id: "list_comments"
    title: "List Instagram comments"
    fields:
      -
        name: "media_id"
        label: "Media id"
        widget_type: "text"
        required: true
      -
        name: "limit"
        label: "Limit"
        widget_type: "number"
        required: false
      -
        name: "cursor"
        label: "Cursor"
        widget_type: "text"
        required: false
  -
    operation_id: "list_replies"
    title: "List Instagram replies"
    fields:
      -
        name: "comment_id"
        label: "Comment id"
        widget_type: "text"
        required: true
      -
        name: "limit"
        label: "Limit"
        widget_type: "number"
        required: false
      -
        name: "cursor"
        label: "Cursor"
        widget_type: "text"
        required: false
  -
    operation_id: "reply_to_comment"
    title: "Reply to Instagram comment"
    fields:
      -
        name: "comment_id"
        label: "Comment id"
        widget_type: "text"
        required: true
      -
        name: "text"
        label: "Text"
        widget_type: "textarea"
        required: true
