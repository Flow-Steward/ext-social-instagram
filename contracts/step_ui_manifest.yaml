forms:
  -
    operation_id: "publish_image"
    title: "Publish an Instagram photo"
    fields:
      -
        name: "image_url"
        label: "Public JPEG image URL"
        widget_type: "text"
        required: true
      -
        name: "caption"
        label: "Post caption"
        widget_type: "textarea"
        required: true
      -
        name: "alt_text"
        label: "Image alternative text"
        widget_type: "text"
        required: false
  -
    operation_id: "publish_carousel"
    title: "Publish an Instagram image carousel"
    fields:
      -
        name: "image_urls"
        label: "Public JPEG image URLs"
        widget_type: "json"
        required: true
      -
        name: "caption"
        label: "Post caption"
        widget_type: "textarea"
        required: true
  -
    operation_id: "get_publish_status"
    title: "Check Instagram publication status"
    fields:
      -
        name: "container_id"
        label: "Publishing container ID"
        widget_type: "text"
        required: true
  -
    operation_id: "publish_container"
    title: "Resume an Instagram publication"
    fields:
      -
        name: "container_id"
        label: "Publishing container ID"
        widget_type: "text"
        required: true
  -
    operation_id: "list_posts"
    title: "List Instagram account posts"
    fields:
      -
        name: "limit"
        label: "Maximum items per page"
        widget_type: "number"
        required: false
      -
        name: "cursor"
        label: "Next-page cursor"
        widget_type: "text"
        required: false
  -
    operation_id: "get_post"
    title: "Get an Instagram post"
    fields:
      -
        name: "media_id"
        label: "Instagram media ID"
        widget_type: "text"
        required: true
  -
    operation_id: "list_comments"
    title: "List comments on an Instagram post"
    fields:
      -
        name: "media_id"
        label: "Instagram media ID"
        widget_type: "text"
        required: true
      -
        name: "limit"
        label: "Maximum items per page"
        widget_type: "number"
        required: false
      -
        name: "cursor"
        label: "Next-page cursor"
        widget_type: "text"
        required: false
  -
    operation_id: "list_replies"
    title: "List replies to an Instagram comment"
    fields:
      -
        name: "comment_id"
        label: "Instagram comment ID"
        widget_type: "text"
        required: true
      -
        name: "limit"
        label: "Maximum items per page"
        widget_type: "number"
        required: false
      -
        name: "cursor"
        label: "Next-page cursor"
        widget_type: "text"
        required: false
  -
    operation_id: "reply_to_comment"
    title: "Reply to an Instagram comment"
    fields:
      -
        name: "comment_id"
        label: "Instagram comment ID"
        widget_type: "text"
        required: true
      -
        name: "text"
        label: "Reply text"
        widget_type: "textarea"
        required: true
