operations:
  -
    operation_id: "publish_image"
    display_name: "Publish an Instagram photo"
    description: "Publish a public HTTPS JPEG with a caption and optional alternative text to the selected professional account. Caption limit: 2,200 characters; return status and available media ID and permalink."
    operation_kind: "action"
    category: "social"
    connection_type_ids:
      - "instagram_account"
    workflow_visible: true
    inputs:
      -
        name: "connection_ref"
        value_type: "connection_ref"
        required: true
      -
        name: "image_url"
        value_type: "text"
        required: true
        display_name: "Public JPEG image URL"
      -
        name: "caption"
        value_type: "text"
        required: true
        display_name: "Post caption"
      -
        name: "alt_text"
        value_type: "text"
        required: false
        display_name: "Image alternative text"
    outputs:
      -
        name: "container_id"
        value_type: "text"
      -
        name: "status"
        value_type: "text"
      -
        name: "media_id"
        value_type: "text"
      -
        name: "permalink"
        value_type: "text"
    result_fields:
      - "result.container_id"
      - "result.status"
      - "result.media_id"
      - "result.permalink"
    error_codes:
      - "not_configured"
      - "invalid_payload"
      - "authentication_failed"
      - "permission_denied"
      - "foreign_object"
      - "not_found"
      - "rate_limited"
      - "provider_unavailable"
      - "timeout"
      - "response_too_large"
      - "ambiguous_external_effect"
      - "internal_error"
  -
    operation_id: "publish_carousel"
    display_name: "Publish an Instagram image carousel"
    description: "Publish 2 to 20 public HTTPS JPEG images as one carousel with a caption of up to 2,200 characters; return status and available media ID and permalink. A failed image prevents an incomplete album from being published."
    operation_kind: "action"
    category: "social"
    connection_type_ids:
      - "instagram_account"
    workflow_visible: true
    inputs:
      -
        name: "connection_ref"
        value_type: "connection_ref"
        required: true
      -
        name: "image_urls"
        value_type: "array"
        required: true
        display_name: "Public JPEG image URLs"
      -
        name: "caption"
        value_type: "text"
        required: true
        display_name: "Post caption"
    outputs:
      -
        name: "container_id"
        value_type: "text"
      -
        name: "child_container_ids"
        value_type: "array"
      -
        name: "status"
        value_type: "text"
      -
        name: "media_id"
        value_type: "text"
      -
        name: "permalink"
        value_type: "text"
    result_fields:
      - "result.container_id"
      - "result.child_container_ids"
      - "result.status"
      - "result.media_id"
      - "result.permalink"
    error_codes:
      - "not_configured"
      - "invalid_payload"
      - "authentication_failed"
      - "permission_denied"
      - "foreign_object"
      - "not_found"
      - "rate_limited"
      - "provider_unavailable"
      - "timeout"
      - "response_too_large"
      - "ambiguous_external_effect"
      - "internal_error"
  -
    operation_id: "get_publish_status"
    display_name: "Check Instagram publication status"
    description: "Read the status of a known publishing container for this connection. This read-only action does not create or publish content."
    operation_kind: "action"
    category: "social"
    connection_type_ids:
      - "instagram_account"
    workflow_visible: true
    inputs:
      -
        name: "connection_ref"
        value_type: "connection_ref"
        required: true
      -
        name: "container_id"
        value_type: "text"
        required: true
        display_name: "Publishing container ID"
    outputs:
      -
        name: "container_id"
        value_type: "text"
      -
        name: "status"
        value_type: "text"
      -
        name: "status_code"
        value_type: "text"
    result_fields:
      - "result.container_id"
      - "result.status"
      - "result.status_code"
    error_codes:
      - "not_configured"
      - "invalid_payload"
      - "authentication_failed"
      - "permission_denied"
      - "foreign_object"
      - "not_found"
      - "rate_limited"
      - "provider_unavailable"
      - "timeout"
      - "response_too_large"
      - "ambiguous_external_effect"
      - "internal_error"
  -
    operation_id: "publish_container"
    display_name: "Resume an Instagram publication"
    description: "Check a container already recorded for this connection and publish it only when ready. Reuse the existing container instead of creating the content again; do not blindly retry an unknown publication outcome."
    operation_kind: "action"
    category: "social"
    connection_type_ids:
      - "instagram_account"
    workflow_visible: true
    inputs:
      -
        name: "connection_ref"
        value_type: "connection_ref"
        required: true
      -
        name: "container_id"
        value_type: "text"
        required: true
        display_name: "Publishing container ID"
    outputs:
      -
        name: "container_id"
        value_type: "text"
      -
        name: "status"
        value_type: "text"
      -
        name: "media_id"
        value_type: "text"
      -
        name: "permalink"
        value_type: "text"
    result_fields:
      - "result.container_id"
      - "result.status"
      - "result.media_id"
      - "result.permalink"
    error_codes:
      - "not_configured"
      - "invalid_payload"
      - "authentication_failed"
      - "permission_denied"
      - "foreign_object"
      - "not_found"
      - "rate_limited"
      - "provider_unavailable"
      - "timeout"
      - "response_too_large"
      - "ambiguous_external_effect"
      - "internal_error"
  -
    operation_id: "list_posts"
    display_name: "List Instagram account posts"
