manifest_version: 2
lifecycle:
  data_schema_version: 1
  data_migrations: []
extension_id: "flowsteward.instagram"
kind: "tool_provider"
version: "0.1.0"
display_name: "Instagram"
description: "Publish Instagram photos and image carousels, reply to comments, and start workflows when new comments arrive."
vendor:
  name: "Flow Steward"
  support_url: "https://github.com/Flow-Steward/ext-social-instagram/issues"
listing:
  category: "marketing"
  tags:
    - "instagram"
    - "images"
    - "comments"
  summary: "Publish Instagram photos and image carousels, reply to comments, and start workflows when new comments arrive."
  description: "Connect an Instagram professional account to Flow Steward for image publishing and comment management through the Instagram API with Instagram Login. Publish a photo with a caption and optional alternative text, or publish an image carousel. Read account posts, retrieve comments and replies, and send a reply to a comment on your own media.\n\nUse these actions to share prepared images for a blog article, announce a product update, or collect audience questions for a review workflow. The New Instagram comment trigger starts a workflow for a new root comment from another person. Follow-up steps can classify the question, prepare a response, or request human approval before replying.\n\nPublishing accepts publicly accessible HTTPS JPEG images, captions up to 2,200 characters and image carousels of 2 to 20 items. It returns publication status and available media identifiers and permalinks. Dedicated status and recovery actions let a workflow inspect or resume a known publishing container without creating the content again.\n\nConfigure a separate project connection for each professional account, using an Instagram Login access token with the required permissions. Signed comment delivery additionally needs a Meta app secret and public HTTPS webhook setup. Advertising, Reels, Stories, video, direct messages, image resizing and text generation are outside this extension; prepare media and copy in earlier workflow steps."
  setup_summary: "Create one connection per Instagram professional account with its account ID, Meta app ID, explicit Graph API version and Instagram Login token. Comment triggers also need an app secret and a public HTTPS webhook with the account subscribed in Meta."
features:
  - "tool"
  - "action"
  - "query"
  - "workflow_trigger"
required_scopes:
  - "extension:invoke"
  - "read:projects"
event_subscriptions:
  -
    event_type: "instagram.comment.created"
    severity: "any"
    conditions: {}
egress:
  hosts:
    - "graph.instagram.com"
schemas:
  config: "schemas/config.schema.yaml"
  secrets: "schemas/secrets.schema.yaml"
  subscriptions: "schemas/subscriptions.schema.yaml"
  input:
    type: "object"
  output:
    type: "object"
    required:
      - "ok"
    properties:
      ok:
        type: "boolean"
entrypoint:
  mode: "subprocess"
  command:
    - "python3"
    - "main.py"
health:
  command:
    - "python3"
    - "health.py"
  timeout_seconds: 5
account_scope:
  scope_type: "project"
  description: "One connection per Instagram professional account; callbacks retain their authenticated anchor connection."
runtime_grants:
  resources:
    project_connection: {}
    provider_secrets:
      secret_keys:
        - "access_token"
        - "app_secret"
    callback_registrations: {}
callbacks:
  -
    callback_id: "comments"
    purpose: "inbound_events"
    methods:
      - "GET"
      - "POST"
    action_id: "ingress_event"
    connection_scoped: true
    auth:
      type: "raw_body_hmac_sha256"
      signature_header: "X-Hub-Signature-256"
      signature_prefix: "sha256="
      secret_name: "app_secret"
      verification:
        token_parameter: "hub.verify_token"
        challenge_parameter: "hub.challenge"
        required_parameters:
          hub.mode: "subscribe"
workflow_triggers:
  -
    trigger_type_id: "instagram_comment_created"
    provider_key: "flowsteward.instagram"
    display_name: "New Instagram comment"
    description: "New root comments by other people on allowed accounts. Filters retain the authenticated callback anchor."
    event_name: "instagram.comment.created"
    provider_ingress_url_required: true
    config_schema:
      type: "object"
      additionalProperties: false
      properties:
        ig_user_id:
          type: "string"
        media_id:
          type: "string"
    ui_schema:
      fields:
        -
          name: "ig_user_id"
          widget_type: "text"
          label: "Instagram account ID"
        -
          name: "media_id"
          widget_type: "text"
          label: "Media ID"
external_effects:
  -
    operation_id: "publish_image"
    effect_kind: "content_publish"
    channel: "instagram"
    idempotency: "required"
    test_mode_behavior: "suppress"
  -
    operation_id: "publish_carousel"
    effect_kind: "content_publish"
    channel: "instagram"
    idempotency: "required"
    test_mode_behavior: "suppress"
  -
    operation_id: "publish_container"
    effect_kind: "content_publish"
    channel: "instagram"
    idempotency: "required"
    test_mode_behavior: "suppress"
  -
    operation_id: "reply_to_comment"
    effect_kind: "comment_reply"
    channel: "instagram"
    idempotency: "required"
    test_mode_behavior: "suppress"
project_state:
  reads:
    -
      namespace: "publishing"
      state_key_from_input: "container_id"
      state_key_prefix: "container:"
  writes:
    -
      namespace: "publishing"
      state_key: "*"
ui_manifest: "ui/ui_manifest.yaml"
action_manifest: "ui/actions/actions.yaml"
query_manifest: "ui/queries/queries.yaml"
runtime:
  contract_version: "extension_host_v2"
  compatibility:
    platform_min: "1.9.0"
  extension_contract_v2:
    connection_types: "contracts/connection_types.yaml"
    operation_manifest: "contracts/operation_manifest.yaml"
    step_ui_manifest: "contracts/step_ui_manifest.yaml"
